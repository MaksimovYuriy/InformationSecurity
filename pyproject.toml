[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-storage-audit"
version = "0.1.0"
description = "Cloud storage security auditor"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
cloud-audit = "cloud_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
